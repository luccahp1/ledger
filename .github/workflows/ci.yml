name: build

# The library has no dependencies, so CI needs nothing but a JDK: no Maven cache,
# no lockfile, no network. Checkout, compile, run the suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '24']
    name: JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Compile
        run: javac -Xlint:all -d out $(find src test -name '*.java')

      - name: Test
        run: java -cp out ledger.Tests
